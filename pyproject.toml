[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossgen"
version = "0.1.0"
description = "CrossGen: Cross-Domain Idea Generator"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.1",
    "sse-starlette>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
crossgen = "crossgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crossgen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
